[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathdocs-local"
version = "0.1.0"
description = "Local, offline-first Hebrew math document generator for Microsoft Word"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1.0", "lxml>=4.9.0"]

[project.optional-dependencies]
windows = ["pywin32>=306"]
ai = ["openai>=1.40.0"]
dev = ["pytest>=8.0"]

[project.scripts]
mathdocs = "mathdocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
